<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Store Checkout System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: inline-block; width: 160px; font-weight: bold; }
    .product-row { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; background-color: #f9f9f9; }
    #validationMessage { color: red; font-weight: bold; margin-bottom: 15px; }
    #orderSummary { font-family: monospace; white-space: pre-wrap; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>MINI STORE CHECKOUT SYSTEM</h1>

  <div class="form-group">
    <label for="customerName">Customer Name</label>
    <input type="text" id="customerName">
  </div>

  <div class="form-group">
    <label for="productCount">Number of Products</label>
    <input type="number" id="productCount" min="1" onchange="generateProductFields()">
  </div>

  <div id="productsContainer"></div>

  <div class="form-group">
    <label for="deliveryOption">Delivery Option</label>
    <select id="deliveryOption">
      <option value="">Select Delivery Option</option>
      <option value="1">1 - Store Pickup (₱0)</option>
      <option value="2">2 - Standard Delivery (₱80)</option>
      <option value="3">3 - Express Delivery (₱150)</option>
    </select>
  </div>

  <div class="form-group">
    <button id="calculateBtn">Calculate Order</button>
  </div>

  <div id="validationMessage"></div>
  <div id="orderSummary"></div>

  <script src="script.js"></script>
</body>
</html>
